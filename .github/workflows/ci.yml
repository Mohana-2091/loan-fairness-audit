name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx ruff

      - name: Lint
        run: ruff check . --select E9,F63,F7,F82

      - name: Run tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t loan-fairness-api .

      - name: Start container
        run: |
          docker run -d -p 8000:8000 --name api loan-fairness-api
          for i in {1..20}; do
            curl -fs http://localhost:8000/health && break
            sleep 2
          done

      - name: Smoke test the prediction endpoint
        run: |
          curl -fs -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"loan_amount":105000,"income":69,"property_value":205000,
                 "loan_to_value_ratio":83.7,"loan_term":360,"loan_type":1,
                 "loan_purpose":1,"lien_status":1,"debt_to_income_ratio":"36"}' \
            | tee response.json
          grep -q denial_probability response.json

      - name: Container logs on failure
        if: failure()
        run: docker logs api
